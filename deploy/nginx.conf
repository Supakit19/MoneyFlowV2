server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Only deploy behind an HTTPS edge/reverse proxy. TLS is required for
    # Google Sign-In and Secure session cookies in production.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/health {
        proxy_pass http://api:3011;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass http://api:3011;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 6m;
    }
    location /ws/ {
        proxy_pass http://api:3061;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
    # Only the isolated LINE webhook gateway is publicly routable.
    location = /webhook/line {
        proxy_pass http://gateway:3012;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
        client_max_body_size 1m;
    }
    location /webhook/ {
        return 404;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # React Router BrowserRouter: deep links must return index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
    location ~ /\. {
        return 404;
    }
}
